name: phase-2-renderer

on:
  push:
    branches:
      - main
    paths:
      - "renderer/**"
      - "yoga/**"
      - "rn-harness/out/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/phase-2-renderer.yml"
  pull_request:
    paths:
      - "renderer/**"
      - "yoga/**"
      - "rn-harness/out/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/phase-2-renderer.yml"
  workflow_dispatch:

jobs:
  renderer-snapshots:
    name: Renderer goldens (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools for Yoga JNI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: renderer/build/yoga-native
          key: yoga-native-${{ runner.os }}-${{ hashFiles('yoga/yoga/**', 'renderer/cmake/CMakeLists.txt') }}

      - name: Run renderer tests
        run: ./gradlew :renderer:test --console=plain --stacktrace

      - name: Upload fresh PNG renders
        # Always upload so that on first run (or after intentional drift) the
        # PNGs are downloadable and can be committed as the new goldens.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-fresh-renders
          path: renderer/build/snapshot-output/*.png
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-test-reports
          path: renderer/build/reports/tests/test
