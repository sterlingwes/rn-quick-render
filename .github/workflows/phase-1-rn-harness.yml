name: phase-1-rn-harness

on:
  push:
    branches:
      - main
    paths:
      - "rn-harness/**"
      - ".github/workflows/phase-1-rn-harness.yml"
  pull_request:
    paths:
      - "rn-harness/**"
      - ".github/workflows/phase-1-rn-harness.yml"
  workflow_dispatch:

jobs:
  fabric-capture:
    name: Fabric capture in Node (golden diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: rn-harness

    steps:
      - uses: actions/checkout@v4
        with:
          # Submodules supply the real-app source code that the
          # `realApp/*` fixtures import (e.g. third_party/bluesky-social-app).
          # Phase 2's renderer job doesn't need them — it only consumes
          # the captured JSON.
          submodules: recursive

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rn-harness/package-lock.json

      - name: Install
        run: npm ci

      - name: Run Jest (goldens vs. fresh capture)
        run: npm test -- --ci

      - name: Re-run capture CLI and diff against committed goldens
        # Jest already checks equality, but this re-runs the standalone CLI
        # path (captureFixtures.ts) and fails the job if it drifts from the
        # tree-of-record. Belt and suspenders against ordering surprises.
        # Only the instruction goldens belong to Phase 1 — layout goldens are
        # derived artefacts owned by the Phase 2 workflow.
        run: |
          npm run capture
          # shellcheck disable=SC2046
          if ! git diff --quiet -- $(git ls-files 'out/*.json' | grep -v '\.layout\.json$'); then
            echo "::error::Fixture re-capture produced a diff against committed goldens:"
            git --no-pager diff -- $(git ls-files 'out/*.json' | grep -v '\.layout\.json$')
            exit 1
          fi

      - name: Upload captured instruction JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-fabric-captures
          path: rn-harness/out/*.json
