name: phase-2-translator

on:
  push:
    branches:
      - claude/phase-0-layoutlib-validation-4apB6
      - main
    paths:
      - "rn-harness/**"
      - "snapshots/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/phase-2-translator.yml"
  pull_request:
    paths:
      - "rn-harness/**"
      - "snapshots/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/phase-2-translator.yml"
  workflow_dispatch:

jobs:
  translator:
    name: Fabric → layoutlib translator (pixel goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # --- Node side: regenerate layout.json from the committed instruction goldens.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rn-harness/package-lock.json

      - name: Install Node deps
        working-directory: rn-harness
        run: npm ci

      - name: Run layout Jest tests
        working-directory: rn-harness
        run: npm test -- --ci

      - name: Re-emit layout JSON and diff against committed layouts
        working-directory: rn-harness
        run: |
          npm run layout
          if ! git diff --quiet -- 'out/*.layout.json'; then
            echo "::error::Layout re-emit drifted from committed goldens:"
            git --no-pager diff -- 'out/*.layout.json'
            exit 1
          fi

      # --- JVM side: record or verify Paparazzi PNGs via the translator.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record or verify Phase 2 snapshots via FabricTranslator
        run: |
          if ls snapshots/src/test/snapshots/images/*Phase2TranslatorTest*.png >/dev/null 2>&1; then
            ./gradlew :snapshots:verifyPaparazziDebug \
              --tests "com.example.snapshot.Phase2TranslatorTest" \
              --no-daemon --stacktrace
          else
            ./gradlew :snapshots:recordPaparazziDebug \
              --tests "com.example.snapshot.Phase2TranslatorTest" \
              --no-daemon --stacktrace
          fi

      - name: Upload Phase 2 PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-translator-snapshots
          path: |
            snapshots/src/test/snapshots/images/*Phase2TranslatorTest*.png
            snapshots/build/reports/paparazzi/
