name: phase-0-snapshot

on:
  push:
    branches:
      - claude/phase-0-layoutlib-validation-4apB6
      - main
  pull_request:
  workflow_dispatch:

jobs:
  paparazzi:
    name: Paparazzi on Linux (layoutlib validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (needed by AGP at compile time, not by Paparazzi itself)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record snapshots (first run) or verify (subsequent runs)
        # If goldens already exist we verify; otherwise record them so the
        # first Linux run lays down the baseline. The step falls back to record
        # mode only when no images are checked in yet.
        run: |
          if ls snapshots/src/test/snapshots/images/*.png >/dev/null 2>&1; then
            ./gradlew :snapshots:verifyPaparazziDebug --no-daemon --stacktrace
          else
            ./gradlew :snapshots:recordPaparazziDebug --no-daemon --stacktrace
          fi

      - name: Run perf harness
        run: ./gradlew :snapshots:testDebugUnitTest --tests "com.example.snapshot.Phase0PerfHarness" --no-daemon --stacktrace

      - name: Upload snapshot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-snapshots
          path: |
            snapshots/src/test/snapshots/images/*.png
            snapshots/build/reports/paparazzi/

      - name: Upload perf metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-metrics
          path: snapshots/build/phase0-metrics.json
